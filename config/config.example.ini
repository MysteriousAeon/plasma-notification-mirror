[General]

# Where mirrored notifications should appear.
# secondary      = first non-primary monitor (default)
# all-secondary  = every non-primary monitor
# screens        = only monitors listed in screens=
# primary        = primary monitor only
# all            = every monitor
mode=secondary

# Used only when mode=screens.
# Comma-separated QScreen names, for example:
# screens=DP-2,DP-3
screens=

# Popup corner:
# top-left
# top-right
# bottom-left
# bottom-right
position=bottom-right

# Popup lifetime in milliseconds.
lifetime_ms=5000

# Popup width in pixels.
width=332

# Maximum simultaneous mirrored notifications per target monitor.
max_notifications=5

# Popup background opacity, from 0 (transparent) to 100 (opaque).
background_opacity=100

# Margins from the selected screen edges in pixels.
# Only the margins relevant to the selected corner are used.
left_margin=18
right_margin=18
top_margin=18
bottom_margin=58

# Gap between stacked notifications in pixels.
gap=12
