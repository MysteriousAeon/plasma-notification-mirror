[General]
# Where mirrored notifications should appear.
# secondary      = first non-primary monitor (default)
# all-secondary  = every non-primary monitor
# screens        = only monitors listed in screens=
# primary        = primary monitor only
# all            = every monitor
mode=secondary

# Used only when mode=screens.
# Comma-separated QScreen names, for example:
# screens=DP-2,DP-3
screens=

# Popup lifetime in milliseconds.
lifetime_ms=5000

# Popup width in pixels.
width=332

# Maximum simultaneous mirrored notifications per target monitor.
max_notifications=5

# Right edge margin in pixels.
right_margin=18

# Bottom margin above the screen edge/panel area in pixels.
bottom_margin=58

# Gap between stacked notifications in pixels.
gap=12
